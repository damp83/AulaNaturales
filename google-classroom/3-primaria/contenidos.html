  t.criterios = e.criterios; t.saberes = e.saberes;
  [...(t.missions || []), ...(t.boss ? [t.boss] : [])].forEach(m => {
    if (e.misiones && e.misiones[m.id]) m.cr = e.misiones[m.id];
    (m.ch || []).forEach((r, i) => { const k = m.id + '#' + i; if (e.retos && e.retos[k]) r.cr = e.retos[k]; });

  });
});
