/* ---------- Panel docente ---------- */
/* ---------- Esquemas ----------
   Formato en contenidos.js: { t:'esquema', q, titulo, tipo:'arbol'|'flujo', nodos:[{txt, hijos:[...]}], extra:[distractores] }
   En los textos, [[palabra]] es un hueco. */
const norm = w => String(w).trim().toLowerCase();
function esqPartes(txt){ return String(txt).split(/(\[\[[^\]]+\]\])/).filter(Boolean); }
function esqRespuestas(ch){ const out=[]; const walk=t=>esqPartes(t).forEach(p=>{ const m=p.match(/^\[\[(.+)\]\]$/); if(m) out.push(m[1]); });
  walk(ch.titulo||''); (function rec(ns){ ns.forEach(n=>{ walk(n.txt); rec(n.hijos||[]); }); })(ch.nodos||[]); return out; }
function esqTexto(ch){ const parts=[]; const t=x=>esqPartes(x).map(p=>p.startsWith('[[')?'…':p).join(''); parts.push(t(ch.titulo||''));
  (function rec(ns){ ns.forEach(n=>{ parts.push(t(n.txt)); rec(n.hijos||[]); }); })(ch.nodos||[]); return parts.join('. '); }
function esqHTML(ch, gap){
  let g = 0;
  const txt = x => esqPartes(x).map(p=>{ const m=p.match(/^\[\[(.+)\]\]$/); return m ? gap(g++) : esc(p); }).join('');
  const title = `<div class="esq-root">${txt(ch.titulo||'')}</div>`;
  if(ch.tipo==='flujo') return `<div class="esq esq-flujo">${title}<ol>${ch.nodos.map(n=>`<li><span class="esq-box">${txt(n.txt)}</span></li>`).join('')}</ol></div>`;
  const rama = n => `<div class="esq-col"><div class="esq-box">${txt(n.txt)}</div>${(n.hijos||[]).length?`<ul>${n.hijos.map(h=>`<li class="esq-leaf">${txt(h.txt)}</li>`).join('')}</ul>`:''}</div>`;
  return `<div class="esq esq-arbol">${title}<div class="esq-cols">${ch.nodos.map(rama).join('')}</div></div>`;
}
function renderEsquemas(){
  const p=P(), v=$('#view-esquemas'); v.setAttribute('style', cvars(CT));
  const items = CT.missions.map((m,k)=>({m,k,ch:(m.ch||[]).find(c=>c.t==='esquema')})).filter(x=>x.ch);
  v.innerHTML = `<div class="topbar"><button class="iconbtn" id="eback" type="button" aria-label="Volver al mapa del tema">${ico('back')}</button><h1 class="outline">Esquemas del tema ${CT.n}</h1></div>
    <div class="guide"><div>${mascotSVG('idle')}</div><div class="bubble">Aquí tienes los esquemas que has completado para repasar. Los demás se rellenan al terminar cada misión.</div></div>
    <div class="esq-list">${items.map(({m,k,ch})=>{ const ok = p.ev && p.ev[ch._k]; const ans = esqRespuestas(ch);
      return `<article class="panel esq-card" style="${cvars(m)}"><div class="lcard-h"><h3 class="outline-sm" style="color:var(--c)">Misión ${k+1}: ${esc(m.title)}</h3>${ok?`<button class="iconbtn" type="button" data-say="${esc(ch._k)}" aria-label="Escuchar el esquema">${ico('sound')}</button>`:''}</div>
        ${esqHTML(ch, i => `<span class="gap ${ok?'filled':''}">${ok?esc(ans[i]):'?'}</span>`)}
        ${ok ? '' : `<p class="tip">Completa la misión para ver este esquema completo.</p>`}</article>`; }).join('')}</div>`;
  v.querySelector('#eback').onclick = goMap;
  v.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{ const ch=items.find(x=>x.ch._k===b.dataset.say).ch; const a=esqRespuestas(ch); let i=0;
    const t=x=>esqPartes(x).map(q=>q.startsWith('[[')?a[i++]:q).join(''); const parts=[t(ch.titulo||'')]; (function rec(ns){ ns.forEach(n=>{ parts.push(t(n.txt)); rec(n.hijos||[]); }); })(ch.nodos); speak(parts.join('. ')); });
  show('view-esquemas');
}
const CREDITOS = `<footer class="creditos">© 2026 <b>Diego Alberto Moya</b>, Maestro de Educación Primaria, Comunidad Autónoma de la Región de Murcia · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" target="_blank" rel="noopener">Licencia CC BY-NC-SA 4.0</a> · Recurso educativo abierto: puedes compartirlo y adaptarlo citando la autoría, sin fines comerciales y con la misma licencia.</footer>`;
const FICHAS_URL = 'https://damp83.github.io/AulaNaturales/fichas/';
let evalTema = 0, evalSel = null;
function evalHTML(list){
  const temas = TEMAS.filter(hasContent), t = temas[Math.min(evalTema, temas.length-1)], cols = columnasEval(t);
  const sab = (t.saberes||[]).map(id=>CUR.saberes.find(x=>x.id===id) || {id, texto:''});
  const sinJuego = crTema(t).filter(c=>!retosDe(t).some(r=>crOf(r).includes(c.id)));
  const cell = (p, col, id) => { const L = logro(p, col.retos);
    if(L.na) return `<td class="num-c" style="color:var(--ink-dim)">—</td>`;
    if(L.none) return `<td class="num-c" style="color:var(--ink-dim)" title="Todavía no ha jugado estos retos">Sin datos</td>`;
    return `<td class="num-c"><button type="button" class="ev-cell" data-st="${esc(id)}" data-col="${esc(col.id)}" title="${L.name}: ${L.pct} % (${L.done} de ${L.total} retos jugados)" style="--c:var(${L.color})">${L.short} <small>${L.pct}%</small></button></td>`; };
  let detail = '';
  if(evalSel){ const row = list.find(r=>r[0]===evalSel.st), col = cols.find(c=>c.id===evalSel.col);
    if(row && col){ const ev = row[1].ev || {};
      detail = `<div class="panel ev-detail"><b>${esc(row[1].name)} · ${esc(col.label)}</b> <small style="color:var(--ink-soft)">${esc(col.title)}</small>
        <ul>${col.retos.map(r=>{ const e=ev[r._k]; const m=!e?['·','No jugado','var(--ink-dim)']:e[0]===1?['✔','A la primera','var(--ok)']:e[0]>0?['~','Con algún fallo','var(--gold)']:['✖','No resuelto','var(--bad)'];
          return `<li><span style="color:${m[2]};font-weight:700">${m[0]} ${m[1]}</span>${e?` <small>(${e[1]} ${e[1]===1?'intento':'intentos'})</small>`:''} · ${esc(r.q)}</li>`; }).join('')}</ul></div>`; } }
  return `<h2 class="outline-sm" style="color:var(--gold)">Evaluación</h2>
    <div class="chips" role="group" aria-label="Tema">${temas.map((x,i)=>`<button type="button" class="tile chip ev-tema" aria-pressed="${x===t}" data-i="${i}">Tema ${x.n}</button>`).join('')}</div>
    <p class="note"><b>Tema ${t.n}: ${esc(t.title)}.</b> ${crTema(t).length ? 'Nivel de logro por criterio de evaluación' : 'Nivel de logro por misión (cuando se añadan los criterios de evaluación, aparecerán aquí)'}, calculado con el mejor resultado de cada reto: acierto a la primera = 100 %, con algún fallo = 50 %. Pulsa una casilla para ver el detalle.</p>
    ${sab.length ? `<div class="panel ev-sab"><b>Saberes básicos</b><ul>${sab.map(x=>`<li><b>${esc(x.id)}</b> ${esc(x.texto)}</li>`).join('')}</ul></div>` : ''}
    <div class="table-wrap panel"><table>
      <thead><tr><th>Alumno/a</th>${cols.map(c=>`<th title="${esc(c.title)} (${c.retos.length} ${c.retos.length===1?'reto':'retos'})">${esc(c.label)}${c.retos.length && c.retos.length<3?'*':''}</th>`).join('')}</tr></thead>
      <tbody>${list.map(([id,p])=>`<tr><td>${esc(p.name)}</td>${cols.map(c=>cell(p,c,id)).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${detail}
    ${cols.some(c=>c.retos.length && c.retos.length<3) ? '<p class="note">* Criterio con menos de 3 retos en este tema: tómalo como orientativo y compleméntalo con otras evidencias.</p>' : ''}
    ${sinJuego.length ? `<p class="note">No evaluables en el juego (evalúalos por otras vías): ${sinJuego.map(c=>`<b>${esc(c.id)}</b> ${esc(c.texto)}`).join(' · ')}</p>` : ''}
    <div class="row"><button class="btn dark small" type="button" id="ev-copy">Copiar tabla</button>${CLOUD ? '<button class="btn dark small" type="button" id="ev-sheet">Guardar en la hoja</button>' : ''}
      <span class="note">Niveles: SB ≥ 90 % · NT ≥ 70 % · SU ≥ 50 % · IN &lt; 50 %</span></div>`;
}
function evalTable(list){
  const t = TEMAS.filter(hasContent)[evalTema], cols = columnasEval(t);
  const head = ['Alumno/a'].concat(CLOUD?['Cuenta']:[]).concat(cols.map(c=>c.label+(c.title?' · '+c.title:'')));
  const rows = list.map(([id,p])=>[p.name].concat(CLOUD?[id]:[]).concat(cols.map(c=>{ const L=logro(p,c.retos); return L.na?'':L.none?'Sin datos':`${L.name} (${L.pct} %)`; })));
  return {tema:`Tema ${t.n}: ${t.title}`, head, rows};
}
function bindEval(v, list){
  v.querySelectorAll('.ev-tema').forEach(b=>b.onclick=()=>{ evalTema=+b.dataset.i; evalSel=null; renderTeacher(); });
  v.querySelectorAll('.ev-cell').forEach(b=>b.onclick=()=>{ evalSel={st:b.dataset.st, col:b.dataset.col}; renderTeacher(); });
  const cp=v.querySelector('#ev-copy'); if(cp) cp.onclick=()=>{
    const T=evalTable(list), tsv=[T.head].concat(T.rows).map(r=>r.join('\t')).join('\n');
    const done=()=>toast('Tabla copiada: pégala en tu cuaderno u hoja de cálculo');
    try{ navigator.clipboard.writeText(tsv).then(done, ()=>fallbackCopy(tsv, done)); }catch(e){ fallbackCopy(tsv, done); }
  };
  const sh=v.querySelector('#ev-sheet'); if(sh) sh.onclick=()=>{
    const T=evalTable(list);
    google.script.run.withSuccessHandler(()=>toast('Evaluación guardada en la hoja de cálculo'))
      .withFailureHandler(e=>toast('No se ha podido guardar: '+(e&&e.message||e))).saveEvaluation(T.tema, T.head, T.rows);
  };
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); ok ? done() : toast('No se ha podido copiar automáticamente');
}
let armedDelete = null;
function renderTeacher(){
  const v=$('#view-teacher'), withC=TEMAS.filter(hasContent);
  if(CLOUD && CLASS===null){
    v.innerHTML = `<div class="topbar"><h1 class="outline">Panel del docente</h1></div><p class="note">Cargando el progreso de la clase…</p>`;
    show('view-teacher');
    google.script.run.withSuccessHandler(rows=>{ CLASS=rows||[]; renderTeacher(); })
      .withFailureHandler(e=>{ CLASS=[]; toast('No se ha podido leer la clase: '+(e&&e.message||e)); renderTeacher(); }).getClass();
    return;
  }
  const list = CLOUD ? CLASS.map(r=>[r.email, r.profile]) : Object.entries(S.profiles);
  v.innerHTML = `<div class="topbar"><button class="iconbtn" id="tback" type="button" aria-label="Volver">${ico('back')}</button><h1 class="outline">Panel del docente</h1></div>
    ${CLOUD ? `<p class="note" style="margin-bottom:14px">Progreso de todo el alumnado que ha entrado con su cuenta del centro. Se guarda en la hoja de cálculo de tu Drive${ME&&ME.sheetUrl?` (<a href="${esc(ME.sheetUrl)}" target="_blank" rel="noopener" style="color:var(--gold)">abrir la hoja</a>)`:''}.</p>
      <div style="margin-bottom:14px"><button class="btn dark small" type="button" id="t-refresh">Actualizar</button></div>`
    : '<p class="note" style="margin-bottom:14px">Progreso del alumnado que ha jugado en este dispositivo. Los datos se guardan solo en este navegador.</p>'}
    ${list.length ? `<div class="table-wrap panel"><table>
      <thead><tr><th>Alumno/a</th><th>Nivel</th><th>XP</th>${withC.map(t=>`<th title="${esc(t.title)}">Tema ${t.n}</th>`).join('')}<th>Insignias</th><th></th></tr></thead>
      <tbody>${list.map(([id,p])=>`<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:32px;display:inline-block">${avatarSVG(p.avatar)}</span><span>${esc(p.name)}${CLOUD?`<br><small style="color:var(--ink-soft)">${esc(id)}</small>`:''}</span></span></td><td class="num-c">${levelOf(p.xp).n}</td><td class="num-c">${p.xp}</td>
        ${withC.map(t=>{ const det=stagesOf(t).map((w,k)=>{ const r=p.worlds[w.id]; return `${w.boss?'Jefe':'M'+(k+1)}: ${r?r.stars+'★ ('+r.plays+'×, '+(r.best||0)+'%)':'—'}`; }).join(' · ');
          return `<td class="num-c" title="${esc(det)}">★ ${temaStars(p,t)}/${temaMax(t)}${temaBeaten(p,t)?' ✓':''}</td>`; }).join('')}
        <td class="num-c">${p.badges.length}/${allBadges().length}</td>
        <td><button class="btn dark small" type="button" data-del="${id}">${armedDelete===id?'¿Seguro? Borrar':'Borrar'}</button></td></tr>`).join('')}</tbody>
    </table></div><p class="note" style="margin-top:8px">Pasa el ratón sobre las estrellas de un tema para ver el detalle por misión (estrellas, veces jugada y mejor % de aciertos a la primera). ✓ = jefe final vencido.</p>` : `<p class="note">Todavía no hay alumnado registrado${CLOUD?'':' en este dispositivo'}.</p>`}
    <div class="teacher-tools">
      ${list.length ? evalHTML(list) : ''}
      <h2 class="outline-sm" style="color:var(--gold)">Fichas para imprimir</h2>
      <div class="tema-toggles panel"><p class="note" style="margin:0">Esquemas en papel para completar a mano (A4, una ficha por página), con recuadro de palabras, espacio para dibujar y autoevaluación.</p>
        <div class="row">${TEMAS.filter(hasContent).map(t=>`<a class="btn dark small" href="${FICHAS_URL}tema-${t.n}-esquemas.pdf" target="_blank" rel="noopener">Tema ${t.n}</a>`).join('')}
        <a class="btn gold small" href="${FICHAS_URL}solucionario-esquemas.pdf" target="_blank" rel="noopener">Solucionario</a></div></div>
      <h2 class="outline-sm" style="color:var(--gold)">Temas del curso</h2>
      <div class="tema-toggles panel">${TEMAS.map((t,i)=>`<label class="switch"><span>Tema ${t.n}: ${esc(t.title)} <small style="color:var(--ink-soft);font-weight:400">${hasContent(t)?`(${t.missions.length} misiones + jefe)`:'(sin contenidos todavía)'}</small></span>
          <span style="display:inline-flex;gap:8px;align-items:center">${i===0?'<small style="color:var(--ink-soft)">Siempre abierto</small>':`<input type="checkbox" data-open="${t.id}" ${S.open[t.id]?'checked':''} ${hasContent(t)?'':'disabled'}> Abrir ya`}</span></label>`).join('')}</div>
      <p class="note">Normalmente cada tema se abre cuando el alumno vence al jefe del tema anterior. Marca «Abrir ya» para abrir un tema a toda la clase aunque no hayan terminado el anterior.</p>
      <h2 class="outline-sm" style="color:var(--gold)">Voz de lectura</h2>
      <div class="tema-toggles panel">
        <label class="switch" for="voice-sel"><span>Voz</span>
          <select id="voice-sel" style="font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:#fff;max-width:100%">
            <option value="">Automática (la más natural)</option>
            ${VOICES.slice().sort((x,y)=>voiceScore(y)-voiceScore(x)).map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
          </select></label>
        <label class="switch" for="voice-rate"><span>Velocidad</span>
          <select id="voice-rate" style="font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:#fff">
            ${[[0.8,'Despacio'],[0.95,'Normal'],[1.1,'Rápida']].map(([r,l])=>`<option value="${r}" ${(S.voiceRate||0.95)==r?'selected':''}>${l}</option>`).join('')}
          </select></label>
        <div><button class="btn blue small" type="button" id="voice-test">${ico('sound')} Probar voz</button></div>
      </div>
      <p class="note">${VOICES.length ? 'Las voces dependen del dispositivo y del navegador. Las más naturales suelen llamarse «Natural», «Online», «Mejorada» o «Google».' : 'Este navegador todavía no ha cargado sus voces. Pulsa «Probar voz» y vuelve a abrir este panel.'}</p>
      <label class="switch"><input type="checkbox" id="free-mode" ${S.free?'checked':''}> Modo libre: todos los temas y misiones desbloqueados</label>
      <p class="note">Estrellas: 3 con un 85 % de aciertos a la primera, 2 con un 60 % y 1 al terminar. Los contenidos se editan en el archivo <b>contenidos.js</b>.</p>
      <h2 class="outline-sm" style="color:var(--gold)">Autoría y licencia</h2>
      <p class="note">Programa y contenidos: <b>Diego Alberto Moya</b>, Maestro de Educación Primaria, Comunidad Autónoma de la Región de Murcia. Licencia <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" target="_blank" rel="noopener" style="color:var(--gold)">Creative Commons Reconocimiento-NoComercial-CompartirIgual 4.0 (CC BY-NC-SA 4.0)</a>. Tipografías Andika y Lilita One con licencia SIL Open Font License. Las referencias al libro de texto pertenecen a sus titulares.</p>
    </div>`;
  v.querySelector('#tback').onclick = ()=> P() ? (CT ? goMap() : goCourse()) : renderWelcome();
  v.querySelector('#voice-sel').onchange = e=>{ S.voice=e.target.value||null; save(); speak('¡Hola! Así sonará mi voz.'); };
  v.querySelector('#voice-rate').onchange = e=>{ S.voiceRate=+e.target.value; save(); speak('¡Hola! Así sonará mi voz.'); };
  v.querySelector('#voice-test').onclick = ()=>{ speak('¡Hola! Soy Glo. ¿Preparados para explorar la naturaleza?'); };
  v.querySelector('#free-mode').onchange = e=>{ S.free=e.target.checked; save(); cloudSettings(); toast(S.free?'Modo libre activado':'Modo libre desactivado'); };
  v.querySelectorAll('[data-open]').forEach(c=>c.onchange=()=>{ S.open[c.dataset.open]=c.checked; save(); cloudSettings(); toast(c.checked?'Tema abierto para la clase':'Tema cerrado'); });
  bindEval(v, list);
  const rf=v.querySelector('#t-refresh'); if(rf) rf.onclick=()=>{ CLASS=null; renderTeacher(); };
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(armedDelete!==id){ armedDelete=id; renderTeacher(); return; }
    armedDelete=null;
    if(CLOUD){
      google.script.run.withSuccessHandler(()=>{ CLASS=CLASS.filter(r=>r.email!==id); if(ME && id===ME.email){ delete S.profiles.me; S.current=null; save(); } toast('Alumno borrado'); renderTeacher(); })
        .withFailureHandler(e=>toast('No se ha podido borrar: '+(e&&e.message||e))).deleteStudent(id);
      return;
    }
    delete S.profiles[id]; if(S.current===id) S.current=null; save(); renderTeacher();
  });
  show('view-teacher');
}

/* ---------- Inicio ---------- */
if(S.music){ const resume=()=>{ setMusic(true); removeEventListener('pointerdown', resume); }; addEventListener('pointerdown', resume); }
function start(){ if(P()) goCourse(); else renderWelcome(); }
if(CLOUD){
  $('#view-welcome').innerHTML = `<div class="logo" style="padding-top:60px"><div class="mascot-wrap">${mascotSVG('idle')}</div><h1 class="outline">Cargando tu partida…</h1></div>`;
  google.script.run
    .withSuccessHandler(st=>{
      ME = st; const set = st.settings || {};
      S.free = !!set.free; S.open = set.open || {};
      S.profiles = {}; S.current = null;
      if(st.profile){ S.profiles.me = st.profile; S.current = 'me'; }
      try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){}
      start();
    })
    .withFailureHandler(e=>{
      const msg = String(e && e.message || e);
      $('#view-welcome').innerHTML = `<div class="logo" style="padding-top:60px"><div class="mascot-wrap">${mascotSVG('oops')}</div><h1 class="outline">No se ha podido entrar</h1>
        <p class="tagline">${msg.includes('NO_EMAIL') ? 'Entra con tu cuenta de Google del colegio y vuelve a abrir el enlace desde Classroom.' : 'Comprueba la conexión a internet y vuelve a abrir el enlace. ('+esc(msg)+')'}</p></div>`;
    })
    .getState();
  addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && pushTimer) pushNow(); });
} else start();
</script>
