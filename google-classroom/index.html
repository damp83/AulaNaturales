<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exploradores de la Naturaleza</title>
<meta name="author" content="Diego Alberto Moya, Maestro de Educación Primaria, Comunidad Autónoma de la Región de Murcia">
<meta name="license" content="CC BY-NC-SA 4.0 · https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: videojuego de un solo mundo (el interior del cuerpo, de noche): mapa de niveles sobre una silueta luminosa, pantallas a tamaño completo */
:root{
  color-scheme:dark;
  --night:#0A1A36; --night-2:#10274D; --panel:#1B3A6B; --panel-2:#24497F; --edge:#06122A;
  --ink:#FFFFFF; --ink-soft:#BFD3F2; --ink-dim:#7F98C2;
  --gold:#FFC93C; --gold-d:#C98A00;
  --sense:#3FB6FF; --sense-d:#1A6FB0;
  --bone:#FFD27A; --bone-d:#C08A2A;
  --lung:#FF6B8B; --lung-d:#B8304F;
  --food:#FF9F43; --food-d:#C2620E;
  --virus:#8BE04E; --virus-d:#3E8A1C;
  --ok:#43D166; --ok-d:#1F8A3B; --bad:#FF5A5A; --bad-d:#B82424;
  --opt0:#D63B50; --opt0-d:#8E1F31; --opt1:#2079C7; --opt1-d:#0F4C85; --opt2:#F2B705; --opt2-d:#A67B00; --opt3:#2E9E3E; --opt3-d:#196626;
  --f-game:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Trebuchet MS','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--night-2),var(--night) 70%) fixed,var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-game);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.icon{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.outline{text-shadow:3px 0 0 var(--edge),-3px 0 0 var(--edge),0 3px 0 var(--edge),0 -3px 0 var(--edge),2px 2px 0 var(--edge),-2px -2px 0 var(--edge),2px -2px 0 var(--edge),-2px 2px 0 var(--edge),0 7px 0 var(--edge)}
.outline-sm{text-shadow:2px 0 0 var(--edge),-2px 0 0 var(--edge),0 2px 0 var(--edge),0 -2px 0 var(--edge),0 4px 0 var(--edge)}
.label{font-family:var(--f-game);font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

/* Botones de videojuego */
.btn{--b:var(--ok);--bd:var(--ok-d);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-game);font-size:1.3rem;letter-spacing:.03em;color:#fff;background:var(--b);border:3px solid var(--edge);border-radius:18px;padding:10px 26px;min-height:58px;cursor:pointer;box-shadow:inset 0 -6px 0 var(--bd),inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 var(--edge);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 var(--bd),0 1px 0 var(--edge)}
.btn.gold{--b:var(--gold);--bd:var(--gold-d);color:var(--edge);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.blue{--b:var(--opt1);--bd:var(--opt1-d)}
.btn.dark{--b:var(--panel-2);--bd:var(--panel)}
.btn.small{font-size:1rem;min-height:42px;padding:6px 16px;border-radius:14px}
.iconbtn{display:inline-grid;place-items:center;width:50px;height:50px;border-radius:16px;border:3px solid var(--edge);background:var(--panel-2);cursor:pointer;flex:none;box-shadow:inset 0 -5px 0 var(--panel),0 4px 0 var(--edge);color:#fff}
.iconbtn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--panel),0 1px 0 var(--edge)}
.iconbtn .icon{width:24px;height:24px}
.iconbtn.on{background:var(--gold);color:var(--edge);box-shadow:inset 0 -5px 0 var(--gold-d),0 4px 0 var(--edge)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--edge);border-radius:26px;box-shadow:inset 0 3px 0 rgba(255,255,255,.12),0 6px 0 var(--edge)}

/* Mascota */
.mascot{width:100%;height:auto;overflow:visible}
.mascot [data-x]{display:none}
.mascot.idle [data-x~="idle"],.mascot.happy [data-x~="happy"],.mascot.oops [data-x~="oops"]{display:inline}
.mascot .m-body{transform-box:fill-box;transform-origin:50% 100%;animation:float 2.6s ease-in-out infinite}
.mascot.happy .m-body{animation:jump .6s ease-out 2}
.mascot.oops .m-body{animation:wobble .5s ease-in-out}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes jump{30%{transform:translateY(-18px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.08,.9)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* Pantalla de título */
.title-screen{display:grid;gap:26px;grid-template-columns:1fr;align-items:center;padding-top:8px}
@media (min-width:860px){.title-screen{grid-template-columns:1fr 1fr}}
.logo{display:grid;justify-items:center;text-align:center;gap:6px}
.logo .mascot-wrap{width:min(46vw,200px)}
.logo h1{font-size:clamp(2.6rem,9vw,4.4rem);line-height:.95;color:var(--gold);transform:rotate(-2deg)}
.logo h1 span{display:block;color:#fff;font-size:.62em}
.logo .tagline{max-width:28em;color:var(--ink-soft);font-size:1.1rem;margin-top:10px}
.world-strip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.world-strip span{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--c);color:var(--edge);border:3px solid var(--edge);box-shadow:inset 0 -5px 0 var(--cd),0 4px 0 var(--edge)}
.world-strip .icon{width:26px;height:26px}
.start-panel{padding:22px;display:grid;gap:18px}
.start-panel h2{font-size:1.6rem;color:var(--gold)}
.slots{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.slot-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;border:3px solid var(--edge);background:var(--night-2);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--edge)}
.slot-btn:hover{border-color:var(--gold)}
.slot-btn .av{font-size:2rem}
.slot-btn b{font-family:var(--f-game);font-weight:400;font-size:1.15rem;display:block;line-height:1.1}
.slot-btn small{color:var(--ink-soft)}
.field label{display:block;font-family:var(--f-game);font-size:1.1rem;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:1.2rem;padding:12px 16px;border-radius:16px;border:3px solid var(--edge);background:var(--night);color:#fff;box-shadow:inset 0 3px 0 rgba(0,0,0,.3)}
.field input::placeholder{color:var(--ink-dim)}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.char{display:grid;justify-items:center;gap:2px;padding:10px 4px 8px;border-radius:18px;border:3px solid var(--edge);background:var(--night-2);cursor:pointer;box-shadow:0 4px 0 var(--edge);transition:transform .12s}
.char span{font-size:2.3rem;line-height:1.1}
.char small{font-family:var(--f-game);font-size:.85rem;color:var(--ink-soft)}
.char[aria-pressed="true"]{background:var(--gold);border-color:var(--edge);transform:translateY(-4px) scale(1.05);box-shadow:0 8px 0 var(--edge)}
.char[aria-pressed="true"] small{color:var(--edge)}
.linkish{background:none;border:0;color:var(--ink-dim);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:.95rem;justify-self:center}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 14px}
.who{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.frame{position:relative;width:64px;height:64px;border-radius:18px;background:var(--gold);border:3px solid var(--edge);display:grid;place-items:center;font-size:2.3rem;box-shadow:inset 0 -5px 0 var(--gold-d)}
.lvl{position:absolute;right:-10px;bottom:-10px;width:32px;height:32px;border-radius:50%;background:var(--opt1);border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--f-game);font-size:1rem;color:#fff}
.who b{font-family:var(--f-game);font-weight:400;font-size:1.35rem;display:block;line-height:1.1}
.who small{color:var(--ink-soft)}
.xp{flex:1 1 220px;min-width:0}
.xp-top{display:flex;justify-content:space-between;font-family:var(--f-game);font-size:.95rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.gbar{height:22px;border-radius:999px;background:var(--edge);border:3px solid var(--edge);overflow:hidden;margin-top:4px}
.gbar span{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px),linear-gradient(180deg,#8BF07A,var(--ok) 55%,var(--ok-d));transition:width .8s cubic-bezier(.3,1.4,.5,1);animation:stripes 1s linear infinite;background-size:22px 22px,100% 100%}
@keyframes stripes{to{background-position:22px 0,0 0}}
.counter{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--edge);font-family:var(--f-game);font-size:1.2rem;font-variant-numeric:tabular-nums}
.counter .icon{width:28px;height:28px}
.counter.star .icon{color:var(--gold);fill:var(--gold)}
.counter.medals .icon{color:var(--food)}
.hud-tools{display:flex;gap:8px;margin-left:auto}

/* Mapa */
.map-layout{display:grid;gap:20px;margin-top:20px;grid-template-columns:1fr}
@media (min-width:800px){.map-layout{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}}
.map-wrap{padding:14px;display:grid;justify-items:center;overflow:hidden}
.map-wrap h2{font-size:1.5rem;justify-self:start;color:var(--gold)}
.bodymap{width:100%;max-width:340px;height:auto;overflow:visible}
.bm-out circle,.bm-out rect{fill:var(--sense);filter:drop-shadow(0 0 10px var(--sense))}
.bm-out .limb{stroke:var(--sense);stroke-width:44;stroke-linecap:round;fill:none}
.bm-in circle,.bm-in rect{fill:#163463}
.bm-in .limb{stroke:#163463;stroke-width:36;stroke-linecap:round;fill:none}
.trail{fill:none;stroke:var(--ink-dim);stroke-width:5;stroke-dasharray:1 12;stroke-linecap:round}
.trail.lit{stroke:var(--gold);stroke-dasharray:none;stroke-width:6;filter:drop-shadow(0 0 4px var(--gold))}
.node{cursor:pointer}
.node .n-top{transition:transform .12s}
.node:hover .n-top{transform:translateY(-3px)}
.node.locked{cursor:not-allowed}
.node text{font-family:var(--f-game);font-size:24px;fill:#fff;paint-order:stroke;stroke:var(--edge);stroke-width:5px;stroke-linejoin:round}
.node .ring{fill:none;stroke:var(--gold);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.node:focus-visible .n-face{stroke:var(--gold);stroke-width:6}
.pin{pointer-events:none}
.pin .bob{transform-box:fill-box;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.missions{display:grid;gap:14px}
.mission{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:3px solid var(--edge);border-radius:22px;padding:12px 14px;cursor:pointer;width:100%;background:linear-gradient(180deg,var(--panel-2),var(--panel));box-shadow:0 5px 0 var(--edge),inset 0 3px 0 rgba(255,255,255,.1);transition:transform .12s}
.mission:hover:not(.is-locked){transform:translateY(-3px) rotate(-.4deg)}
.mission.is-locked{filter:saturate(.25) brightness(.8);cursor:not-allowed}
.mission.is-next{border-color:var(--gold);box-shadow:0 5px 0 var(--edge),0 0 0 3px var(--gold),0 0 22px rgba(255,201,60,.45)}
.coin{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--c);color:var(--edge);border:3px solid var(--edge);box-shadow:inset 0 -6px 0 var(--cd),inset 0 3px 0 rgba(255,255,255,.4)}
.coin .icon{width:30px;height:30px;stroke-width:2.5}
.mission h3{font-size:1.3rem}
.mission .meta{font-size:.85rem;color:var(--ink-soft)}
.mission .lvltag{font-family:var(--f-game);font-size:.85rem;color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.stars{display:inline-flex;gap:2px}
.stars .icon{width:26px;height:26px;color:var(--edge);fill:var(--panel)}
.stars .on{color:var(--gold-d);fill:var(--gold)}
.mission .side{display:grid;justify-items:center;gap:6px}
.play-tag{font-family:var(--f-game);font-size:.9rem;padding:3px 12px;border-radius:999px;background:var(--ok);color:#fff;border:2px solid var(--edge)}
.mission.is-locked .play-tag{background:var(--panel)}
.map-extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-top:18px}
.extra{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;cursor:pointer;border-radius:22px;border:3px solid var(--edge);background:var(--night-2);box-shadow:0 5px 0 var(--edge)}
.extra:hover{border-color:var(--c)}
.extra .coin{width:54px;height:54px}
.extra b{display:block;font-family:var(--f-game);font-weight:400;font-size:1.25rem}
.extra small{color:var(--ink-soft)}

/* Lección */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:clamp(1.7rem,5vw,2.5rem);color:var(--c,var(--gold));flex:1 1 260px;min-width:0}
.guide{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:18px}
.bubble{position:relative;background:#fff;color:var(--edge);border:3px solid var(--edge);border-radius:22px;padding:14px 18px;font-weight:700;font-size:1.1rem;box-shadow:0 5px 0 var(--edge)}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--edge);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid #fff;border-left:0}
.learn-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.lcard{padding:18px;display:grid;gap:10px;align-content:start;position:relative}
.lcard-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lcard h3{font-size:1.45rem;color:var(--c)}
.lcard p{font-size:1.1rem}
.lcard mark{background:none;color:var(--c);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 12px;border-radius:999px;background:var(--edge);font-weight:700;font-size:.95rem}
.senses{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:1.05rem}
.senses b{color:var(--c)}
.steps{margin:0;padding-left:1.5em;display:grid;gap:6px;font-size:1.05rem}
.steps li::marker{font-family:var(--f-game);color:var(--c)}
.flow{display:grid;justify-items:center;gap:2px;text-align:center;font-size:1rem}
.flow .box{padding:6px 14px;border-radius:14px;border:3px solid var(--edge);font-family:var(--f-game);background:var(--edge)}
.flow .box.fill{background:var(--c);color:var(--edge)}
.flow .arrow{color:var(--ink-soft);font-size:.92rem}
.flow .split{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:6px}
.learn-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px;align-items:center}

/* Pantalla de inicio de misión */
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:var(--c);cursor:pointer}
#splash::before{content:"";position:absolute;width:220vmax;height:220vmax;left:50%;top:50%;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-in{position:relative;display:grid;justify-items:center;gap:8px;text-align:center;padding:16px;animation:zoomin .45s cubic-bezier(.3,1.6,.5,1)}
.splash-in .mascot-wrap{width:150px}
.splash-in .label{color:var(--edge);font-size:1.2rem}
.splash-in h1{font-size:clamp(2rem,8vw,3.6rem);color:#fff;max-width:14em}
.splash-go{font-family:var(--f-game);font-size:clamp(2.4rem,10vw,4.6rem);color:var(--gold);margin-top:10px;animation:zoomin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes zoomin{from{transform:scale(.3);opacity:0}}

/* Juego */
#view-play{padding-bottom:190px}
.play-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:16px}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:18px;border-radius:6px;background:var(--edge);border:2px solid var(--edge)}
.segs i.ok{background:var(--ok)}
.segs i.meh{background:var(--gold)}
.segs i.now{background:var(--panel-2);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{background:var(--ink-dim)}}
.play-count{font-family:var(--f-game);font-size:.95rem;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:2px}
.hearts .icon{width:32px;height:32px;stroke:var(--edge);stroke-width:2.4}
.hearts .full{fill:var(--bad)}
.hearts .empty{fill:var(--panel)}
.hearts .lost{animation:lose .6s}
@keyframes lose{40%{transform:scale(1.6) rotate(-15deg)}}
.combo-badge{font-family:var(--f-game);color:var(--food);font-size:1.3rem;white-space:nowrap;display:flex;align-items:center;gap:4px}
.combo-badge .icon{fill:var(--food);stroke:var(--edge);width:28px;height:28px}
.arena{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:14px;padding:12px 16px}
.arena .fighter{width:96px}
.arena .vs{display:grid;gap:6px;text-align:center}
.hp{height:22px;border-radius:999px;background:var(--edge);border:3px solid var(--edge);overflow:hidden}
.hp span{display:block;height:100%;background:linear-gradient(180deg,#FF8A8A,var(--bad) 60%,var(--bad-d));transition:width .5s}
.boss-name{font-family:var(--f-game);font-size:1.15rem;color:var(--virus)}
.virus{width:100%;height:auto;overflow:visible}
.virus .v-body{transform-box:fill-box;transform-origin:center;animation:vfloat 2s ease-in-out infinite}
.virus .spikes{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
.virus.hit .v-body{animation:vhit .5s}
.virus.dead .v-body{animation:vdead .9s forwards}
@keyframes vfloat{50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes vhit{0%,100%{filter:none}20%{filter:brightness(3);transform:translateX(10px) scale(.9)}50%{transform:translateX(-8px)}}
@keyframes vdead{to{transform:scale(0) rotate(540deg);opacity:0}}
.qbox{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:16px}
.qbox .bubble{font-size:clamp(1.15rem,3.4vw,1.45rem);line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.qbox .bubble h2{font-family:var(--f-body);font-weight:700;font-size:inherit;flex:1;min-width:0}
.qbox .bubble .iconbtn{width:44px;height:44px;border-radius:14px}
.stage{padding:18px}
.stage.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.tip{color:var(--ink-soft);font-size:1rem}
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opts.long{grid-template-columns:1fr}
.opt{--b:var(--opt0);--bd:var(--opt0-d);display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 18px;text-align:left;font-weight:700;font-size:1.2rem;color:#fff;background:var(--b);border:3px solid var(--edge);border-radius:20px;cursor:pointer;box-shadow:inset 0 -7px 0 var(--bd),inset 0 3px 0 rgba(255,255,255,.3),0 5px 0 var(--edge);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s,opacity .2s}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 -3px 0 var(--bd),0 1px 0 var(--edge)}
.opt .shape{width:34px;height:34px;flex:none;fill:#fff;stroke:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.opt.c1{--b:var(--opt1);--bd:var(--opt1-d)}
.opt.c2{--b:var(--opt2);--bd:var(--opt2-d);color:var(--edge);text-shadow:none}
.opt.c2 .shape{fill:var(--edge)}
.opt.c3{--b:var(--opt3);--bd:var(--opt3-d)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.25;transform:scale(.96)}
.opt.win{outline:5px solid #fff;outline-offset:3px;animation:winpop .5s}
@keyframes winpop{40%{transform:scale(1.06)}}
.tile{border:3px solid var(--edge);background:var(--panel-2);color:#fff;border-radius:18px;cursor:pointer;font-weight:700;box-shadow:inset 0 -5px 0 var(--panel),0 4px 0 var(--edge);transition:transform .08s,background .2s}
.tile:hover:not(:disabled){transform:translateY(-2px);background:#2D5796}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--panel),0 1px 0 var(--edge)}
.tile[aria-pressed="true"],.tile.sel{background:var(--gold);color:var(--edge);box-shadow:inset 0 -5px 0 var(--gold-d),0 4px 0 var(--edge)}
.tile:disabled{cursor:default}
.tile.ok{background:var(--ok)!important;color:#fff!important;box-shadow:inset 0 -5px 0 var(--ok-d),0 4px 0 var(--edge)!important}
.tile.bad{background:var(--bad)!important;color:#fff!important;box-shadow:inset 0 -5px 0 var(--bad-d),0 4px 0 var(--edge)!important;animation:shake .4s}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:12px 20px;font-size:1.15rem;min-height:58px}
.chip:disabled:not(.ok):not([aria-pressed="true"]){opacity:.4}
.sort-wrap{display:grid;gap:16px}
.slots-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.slot{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;min-height:60px;font-size:1.08rem;border-style:dashed;background:var(--night);box-shadow:none}
.slot.filled{border-style:solid;background:var(--panel-2);box-shadow:inset 0 -5px 0 var(--panel),0 4px 0 var(--edge)}
.slot:disabled{color:var(--ink-dim)}
.slot.filled:disabled{color:#fff}
.num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--edge);font-family:var(--f-game);font-size:1.1rem;border:2px solid var(--edge);flex:none}
.pool{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card-opt{padding:12px 14px;font-size:1.08rem;text-align:left;min-height:60px}
.sort-item{justify-self:center;padding:16px 28px;border-radius:22px;background:#fff;color:var(--edge);border:4px solid var(--edge);font-size:1.5rem;font-weight:700;text-align:center;box-shadow:0 7px 0 var(--edge);animation:dropin .35s cubic-bezier(.3,1.6,.5,1)}
.sort-item.bad{animation:shake .4s;background:#FFE1E1}
@keyframes dropin{from{transform:translateY(-30px) scale(.8);opacity:0}}
.bins{display:grid;gap:12px}
.bins.b2{grid-template-columns:1fr 1fr}
.bins.b3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bin{display:grid;align-content:start;gap:6px;padding:14px 8px;min-height:130px;text-align:center}
.bin-name{font-family:var(--f-game);font-size:1.25rem;color:var(--gold)}
.bin-list{font-size:.85rem;font-weight:400;color:var(--ink-soft);overflow-wrap:anywhere}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:10px;align-content:start}
.m{padding:12px;min-height:60px;font-size:1.08rem}
.sentence{font-size:1.35rem;line-height:2.3;font-weight:700}
.blank{display:inline-block;min-width:4.5em;text-align:center;border-bottom:4px solid var(--ink-dim);padding:0 8px;color:var(--ink-dim)}
.blank.active{border-color:var(--gold);color:var(--gold);background:rgba(255,201,60,.12);border-radius:10px 10px 0 0;animation:blink 1.2s infinite}
.blank.filled{color:var(--ok);border-color:var(--ok)}

/* Barra de respuesta */
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:4px solid var(--edge);animation:slideup .3s cubic-bezier(.3,1.4,.5,1)}
.feedback .fb-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.feedback.good{background:linear-gradient(180deg,#2FBF55,var(--ok-d))}
.feedback.wrong{background:linear-gradient(180deg,#F25A5A,var(--bad-d))}
.feedback .fb-text{flex:1 1 260px;min-width:0}
.feedback b{font-family:var(--f-game);font-weight:400;font-size:clamp(1.6rem,5vw,2.2rem);display:block;line-height:1.1}
.feedback span{font-weight:700;font-size:1.08rem}
@keyframes slideup{from{transform:translateY(100%)}}
.pop{position:fixed;left:50%;top:38%;z-index:55;font-family:var(--f-game);font-size:clamp(2.6rem,10vw,4.8rem);color:var(--gold);pointer-events:none;white-space:nowrap;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(-6deg);opacity:0}}
.float-xp{position:fixed;font-family:var(--f-game);font-size:1.8rem;color:var(--gold);pointer-events:none;animation:rise 1.1s ease-out forwards;z-index:30}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(1.2)}to{opacity:0;transform:translateY(-70px) scale(1)}}

/* Resultado */
.result{max-width:640px;margin:10px auto 0;text-align:center;display:grid;gap:20px;justify-items:center}
.ribbon{position:relative;background:var(--gold);color:var(--edge);font-family:var(--f-game);font-size:clamp(1.7rem,6vw,2.6rem);padding:12px 44px;border:4px solid var(--edge);box-shadow:inset 0 -6px 0 var(--gold-d),0 6px 0 var(--edge);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);animation:zoomin .5s cubic-bezier(.3,1.6,.5,1)}
.ribbon.fail{background:var(--opt1);color:#fff;box-shadow:inset 0 -6px 0 var(--opt1-d),0 6px 0 var(--edge)}
.star-stage{position:relative;display:grid;place-items:center;padding:20px 0;width:100%;overflow:hidden}
.star-stage::before{content:"";position:absolute;width:420px;height:420px;max-width:none;left:50%;top:50%;margin:-210px 0 0 -210px;background:repeating-conic-gradient(rgba(255,201,60,.16) 0 12deg,transparent 12deg 24deg);border-radius:50%;animation:spin 18s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.big-stars{position:relative;display:flex;gap:8px;align-items:flex-end}
.big-stars .icon{width:88px;height:88px;stroke:var(--edge);stroke-width:1.6;fill:var(--panel);transition:fill .2s}
.big-stars .icon:nth-child(2){width:110px;height:110px}
.big-stars .icon.on{fill:var(--gold);animation:starin .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes starin{from{transform:scale(2.4) rotate(-40deg);opacity:0}}
.res-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.res-stats div{padding:12px 6px}
.res-stats b{display:block;font-family:var(--f-game);font-weight:400;font-size:2rem;font-variant-numeric:tabular-nums;color:var(--gold)}
.res-stats small{color:var(--ink-soft);font-size:.9rem}
.levelup{background:var(--opt1);border:3px solid var(--edge);border-radius:18px;padding:12px 18px;font-family:var(--f-game);font-size:1.4rem;width:100%;box-shadow:0 5px 0 var(--edge);animation:zoomin .5s .8s backwards}
.chest{display:grid;gap:10px;width:100%;padding:16px}
.chest h3{color:var(--gold);font-size:1.4rem}
.new-badge{display:flex;gap:14px;align-items:center;text-align:left;animation:zoomin .5s backwards}
.medal{position:relative;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--c,var(--gold));color:var(--edge);border:3px solid var(--edge);flex:none;box-shadow:inset 0 -6px 0 var(--cd,var(--gold-d)),inset 0 3px 0 rgba(255,255,255,.45);overflow:hidden}
.medal .icon{width:32px;height:32px;stroke-width:2.6}
.medal::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-80%)}100%{transform:translateX(80%)}}

/* Calma */
.calm{max-width:580px;margin:0 auto;display:grid;gap:22px;justify-items:center;text-align:center}
.breath-stage{width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center;position:relative;max-width:100%}
.breath{width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB3C4,var(--lung) 60%,var(--lung-d));box-shadow:0 0 40px var(--lung);transform:scale(1);transition-property:transform;transition-timing-function:ease-in-out}
.breath-ring{position:absolute;inset:0;border-radius:50%;border:4px dashed var(--panel-2)}
.breath-label{position:absolute;font-family:var(--f-game);font-size:1.9rem}
.phase-steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.phase-steps span{padding:6px 14px;border-radius:999px;border:3px solid var(--edge);background:var(--night-2);font-family:var(--f-game);color:var(--ink-dim)}
.phase-steps span.on{background:var(--lung);color:#fff}
.feel{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.feel button{font-size:2.4rem;width:78px;height:78px}

/* Insignias */
.badge-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.bcard{display:flex;gap:14px;align-items:center;padding:14px}
.bcard.locked .medal{background:var(--panel);color:var(--ink-dim);box-shadow:inset 0 -6px 0 var(--edge)}
.bcard.locked .medal::after{display:none}
.bcard.locked b{color:var(--ink-dim)}
.bcard b{font-family:var(--f-game);font-weight:400;font-size:1.2rem}
.bcard small{color:var(--ink-soft);display:block;font-size:.9rem;line-height:1.35}

/* Docente */
.table-wrap{overflow-x:auto;padding:4px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:10px 12px;text-align:left;border-bottom:2px solid var(--edge);white-space:nowrap}
th{font-family:var(--f-game);font-weight:400;letter-spacing:.06em;color:var(--gold)}
td.num-c{font-variant-numeric:tabular-nums}
.teacher-tools{display:grid;gap:14px;margin-top:18px}
.switch{display:flex;gap:10px;align-items:center;font-weight:700}
.switch input{width:24px;height:24px;accent-color:var(--gold)}
.note{color:var(--ink-soft);font-size:.95rem;max-width:64ch}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--gold);color:var(--edge);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);padding:10px 20px;border-radius:16px;font-family:var(--f-game);font-size:1.1rem;z-index:70;max-width:calc(100% - 32px);text-align:center;animation:zoomin .3s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.region{display:grid;gap:2px;text-align:center;font-family:var(--f-game);font-size:1.25rem;color:var(--gold);padding:10px 14px;margin:6px 0 34px;border:3px dashed var(--panel-2);border-radius:18px;background:var(--night)}
.region .label{font-size:.75rem;text-shadow:none}
.region~.region{margin-top:10px}
.ev-cell{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--edge);border-radius:10px;padding:3px 10px;background:var(--c);color:var(--edge)}
.ev-cell small{font-weight:400}
.ev-detail,.ev-sab{padding:14px;margin-top:10px}
.ev-detail ul,.ev-sab ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:4px;font-size:.95rem}
.esq{display:grid;gap:14px;justify-items:center}
.esq-root{background:var(--c);color:var(--edge);border:3px solid var(--edge);border-radius:16px;padding:10px 18px;font-family:var(--f-game);font-size:1.3rem;text-align:center;box-shadow:0 4px 0 var(--edge)}
.esq-cols{display:grid;gap:14px;width:100%;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));position:relative;padding-top:14px;border-top:3px dashed var(--panel-2)}
.esq-col{display:grid;gap:8px;align-content:start;min-width:0}
.esq-box{display:block;background:var(--night);border:3px solid var(--c);border-radius:14px;padding:8px 12px;font-weight:700;text-align:center;line-height:1.9}
.esq-col ul{list-style:none;margin:0;padding:0 0 0 14px;display:grid;gap:6px;border-left:3px solid var(--panel-2)}
.esq-leaf{background:var(--panel);border-radius:12px;padding:6px 10px;line-height:1.9;font-size:1rem}
.esq-flujo ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;justify-items:center;counter-reset:paso;width:100%}
.esq-flujo li{display:grid;justify-items:center;gap:4px;width:min(100%,460px);counter-increment:paso}
.esq-flujo li .esq-box{width:100%}
.esq-flujo li .esq-box::before{content:counter(paso) ". ";color:var(--c);font-family:var(--f-game)}
.esq-flujo li+li::before{content:"↓";color:var(--ink-dim);font-size:1.3rem;line-height:1}
.gap{display:inline-block;min-width:3.6em;margin:0 2px;padding:0 8px;border:2px dashed var(--ink-dim);border-radius:10px;background:var(--edge);color:var(--ink-dim);font:inherit;font-weight:700;cursor:pointer;line-height:1.6}
.gap.active{border:3px solid var(--gold);color:var(--gold);animation:blink 1.2s infinite}
.gap.filled{border:2px solid var(--ok);background:var(--ok);color:#fff;cursor:default}
.gap.bad{animation:shake .4s}
.esq-bank{justify-content:center}
.esq-list{display:grid;gap:16px}
.esq-card{padding:16px;display:grid;gap:12px}
.creditos{margin-top:28px;text-align:center;font-size:.85rem;color:var(--ink-dim);max-width:70ch;margin-inline:auto}
.creditos b{color:var(--ink-soft)}
.creditos a{color:var(--gold)}
/* Personajes */
.avatar{width:100%;height:auto;overflow:visible;display:block}
.frame .avatar{width:52px;margin-top:4px}
.char-preview{display:flex;gap:16px;align-items:center;padding:12px;border-radius:22px;background:radial-gradient(circle at 25% 60%,rgba(255,201,60,.35),transparent 60%),var(--night);border:3px solid var(--edge)}
.char-preview .big{width:110px;flex:none;animation:float 2.6s ease-in-out infinite}
.char-preview b{font-family:var(--f-game);font-weight:400;font-size:1.8rem;display:block;line-height:1;color:var(--gold)}
.char-preview .role{font-family:var(--f-game);color:#fff;font-size:1.05rem}
.char-preview p{color:var(--ink-soft);font-size:.95rem;margin-top:4px}
.char .avatar{width:58px}
.slot-btn .avatar{width:44px;flex:none}
.fighter .avatar{width:84px;margin:0 auto}

/* Mapa del curso */
.course-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:22px 0 6px}
.course-head h2{font-size:clamp(1.8rem,5vw,2.4rem);color:var(--gold)}
.course-layout{display:grid;gap:20px;grid-template-columns:1fr;align-items:start}
@media (min-width:900px){.course-layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.road{padding:50px 14px 22px}
.tema-row{display:flex}
.tema-row.shift{padding-left:48px}
.tema{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;cursor:pointer;text-align:left;width:100%;min-width:0}
.planet{position:relative;width:110px;height:110px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--edge);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 35%),var(--c);border:4px solid var(--edge);box-shadow:inset 0 -12px 0 var(--cd),0 7px 0 var(--edge);transition:transform .15s}
.planet .icon{width:50px;height:50px;stroke-width:2.4}
.tema:hover:not(.locked) .planet{transform:translateY(-4px) rotate(-4deg)}
.tema.is-next .planet::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:4px dashed var(--gold);animation:spin 10s linear infinite}
.tnum{position:absolute;left:-6px;top:-6px;width:40px;height:40px;border-radius:50%;background:var(--gold);border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--f-game);font-size:1.3rem;color:var(--edge);box-shadow:inset 0 -4px 0 var(--gold-d)}
.tpin{position:absolute;left:50%;margin-left:-24px;top:-56px;width:48px;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 4px 0 var(--edge))}
.tema.locked{cursor:not-allowed}
.tema.locked .planet{background:#3A4C70;color:#9FB0CF;box-shadow:inset 0 -12px 0 #2A3856,0 7px 0 var(--edge)}
.tema.soon .planet{background:repeating-linear-gradient(45deg,#33456A 0 10px,#2C3C5E 10px 20px)}
.tlabel{display:grid;gap:3px;min-width:0;flex:1}
.tlabel h3{font-size:1.45rem}
.tlabel .lvltag{font-family:var(--f-game);font-size:.9rem;color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.tema.locked .tlabel .lvltag,.tema.locked h3{color:var(--ink-dim)}
.tlabel .meta{color:var(--ink-soft);font-size:.92rem}
.tstatus{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.tstatus .counter{font-size:1rem;padding:3px 12px 3px 6px}
.tstatus .counter .icon{width:22px;height:22px}
.chip-s{font-family:var(--f-game);font-size:.9rem;padding:3px 12px;border-radius:999px;background:var(--panel);border:2px solid var(--edge);color:var(--ink-soft)}
.chip-s.done{background:var(--ok);color:#fff}
.chip-s.soon{background:var(--night);color:var(--gold)}
.chip-s.go{background:var(--gold);color:var(--edge)}
.conn{display:block;width:160px;height:56px;overflow:visible}
.conn path{fill:none;stroke:var(--ink-dim);stroke-width:6;stroke-dasharray:1 13;stroke-linecap:round}
.conn path.lit{stroke:var(--gold);stroke-dasharray:none;filter:drop-shadow(0 0 4px var(--gold))}
.side-col{display:grid;gap:14px}
.progress-card{padding:16px;display:grid;gap:10px}
.progress-card h3{color:var(--gold);font-size:1.3rem}
.ptema{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:700}
.ptema .dot{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--f-game);color:var(--edge);font-size:.95rem}
.ptema .gbar{height:14px;margin:0;border-width:2px}
.ptema small{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.badge-group{display:grid;gap:12px;margin-bottom:22px}
.badge-group h2{font-size:1.4rem;color:var(--gold)}
.tema-toggles{display:grid;gap:8px;padding:14px}
.tema-toggles .switch{justify-content:space-between;flex-wrap:wrap}
.unlock-banner{background:var(--c);color:var(--edge);border:3px solid var(--edge);border-radius:18px;padding:12px 18px;font-family:var(--f-game);font-size:1.3rem;width:100%;box-shadow:inset 0 -5px 0 var(--cd),0 5px 0 var(--edge);animation:zoomin .5s 1s backwards}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="app">
  <section id="view-welcome" class="view"></section>
  <section id="view-course" class="view" hidden></section>
  <section id="view-map" class="view" hidden></section>
  <section id="view-learn" class="view" hidden></section>
  <section id="view-play" class="view" hidden></section>
  <section id="view-result" class="view" hidden></section>
  <section id="view-calm" class="view" hidden></section>
  <section id="view-badges" class="view" hidden></section>
  <section id="view-teacher" class="view" hidden></section>
  <section id="view-esquemas" class="view" hidden></section>
</main>
<div id="splash" hidden></div>
<div id="feedback" class="feedback" role="status" hidden>

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* Baraja garantizando que el orden no coincide con el del libro */
function mix(a, bad, keepBookOrder){ if(a.length<2) return a.slice(); let r, n=0; do { r=shuffle(a); n++; } while(n<50 && ((!keepBookOrder && r.every((v,i)=>v===a[i])) || (bad && bad(r)))); return r; }

const hasContent = t => !!(t.missions && t.missions.length && t.boss);
const stagesOf = t => hasContent(t) ? [...t.missions, t.boss] : [];
const temaStars = (p,t) => stagesOf(t).reduce((n,w)=>n+stars(p,w.id),0);
const temaMax = t => stagesOf(t).length*3;

function levelOf(xp){ let i=0; LEVELS.forEach((l,k)=>{ if(xp>=l[0]) i=k; }); return {n:i+1, name:LEVELS[i][1], from:LEVELS[i][0], to:LEVELS[i+1]?LEVELS[i+1][0]:null}; }

  return S.free || !!S.open[t.id] || i===0 || temaBeaten(P(), TEMAS[i-1]);

function unlocked(idx){
  const L=stagesOf(CT);
  if(S.free) return true;

  return idx===0 || stars(P(), L[idx-1].id)>0;
}

/* ---------- Evaluación por criterios ----------
   Cada reto tiene una clave fija (misión#posición). Se guarda el mejor resultado de cada alumno:
   1 = acierto a la primera, 0,5 = acierto tras fallar, 0 = no resuelto (sin corazones en el jefe).
   Los criterios se asocian en contenidos.js: CURRICULO, y en cada tema/misión/reto con «cr». */
const CUR = (typeof CURRICULO !== 'undefined' && CURRICULO) || {criterios:[], saberes:[]};
const LOGRO = [[90,'Sobresaliente','SB','--ok'],[70,'Notable','NT','--sense'],[50,'Suficiente','SU','--gold'],[0,'Insuficiente','IN','--bad']];
TEMAS.forEach(t=>{ stagesOf(t).forEach(w=>{
  (w.ch||[]).forEach((c,i)=>{ c._k = w.id+'#'+i; c._w = w; c._t = t; });
  (w.extra||[]).forEach((c,i)=>{ c._k = w.id+'#x'+i; c._w = w; c._t = t; });
}); });
const crOf = c => c.cr || c._w.cr || [];
function retosDe(t){ return stagesOf(t).flatMap(w=>[...(w.ch||[]), ...(w.extra||[])]); }
function crTema(t){ return (t.criterios || []).map(id=>CUR.criterios.find(c=>c.id===id) || {id, texto:''}); }
function columnasEval(t){
  // Con criterios definidos: una columna por criterio del tema. Si no, una por misión.
  if(crTema(t).length) return crTema(t).map(c=>({id:c.id, label:c.id, title:c.texto, retos: retosDe(t).filter(r=>crOf(r).includes(c.id))}));
  return t.missions.map((m,k)=>({id:m.id, label:'M'+(k+1), title:m.title, retos: m.ch}));
}
function logro(p, retos){
  const ev = p.ev || {}; const hechos = retos.filter(r=>ev[r._k]);
  if(!retos.length) return {na:true};
  if(!hechos.length) return {none:true, total:retos.length};
  const pct = Math.round(hechos.reduce((n,r)=>n+ev[r._k][0],0)/hechos.length*100);
  const L = LOGRO.find(l=>pct>=l[0]);
  return {pct, name:L[1], short:L[2], color:L[3], done:hechos.length, total:retos.length};
}
function recordResult(score){
  const p=P(), c=M.list[M.i]; if(!p || !c || !c._k) return;
  p.ev = p.ev || {}; const prev = p.ev[c._k];
  p.ev[c._k] = [Math.max(prev?prev[0]:0, score), (prev?prev[1]:0)+1];
  save();
}
function allBadges(){
  const out=[];
  TEMAS.filter(hasContent).forEach(t=>{
    t.missions.forEach(m=>out.push({id:m.id, name:m.badge||m.short, desc:`Completa la misión «${m.title}».`, icon:m.icon, color:m.color, tema:t}));
    out.push({id:t.boss.id, name:t.boss.badge||'Jefe derrotado', desc:`Derrota al ${t.boss.villain||'jefe'} del tema ${t.n}.`, icon:'trophy', color:t.boss.color, tema:t});
    out.push({id:'tres-'+t.id, name:t.starsBadge||'Constelación', desc:`Consigue 3 estrellas en todas las misiones del tema ${t.n}.`, icon:'star', tema:t});
  });
  return [...out, ...GLOBAL_BADGES];
}

/* ---------- Sonido 8 bits, música, voz y efectos ---------- */
let AC = null;
function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f, t, dur, type='square', vol=.08){
  const a=ac(), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function sfx(kind){
  if(!S.sound) return;
  try{
    const t=ac().currentTime;
    const seqs = {ok:[[659,.08],[880,.08],[1319,.16]], bad:[[311,.12],[233,.22]], tick:[[1047,.06]], coin:[[988,.06],[1319,.14]],
      win:[[523,.1],[659,.1],[784,.1],[1047,.1],[784,.08],[1047,.3]], level:[[392,.08],[523,.08],[659,.08],[784,.08],[1047,.08],[1319,.3]],
      star:[[1175,.06],[1568,.18]], hit:[[180,.05],[90,.18]], go:[[523,.12],[523,.12],[1047,.3]]};
    let at=t; seqs[kind].forEach(([f,d])=>{ tone(f, at, d, kind==='hit'?'sawtooth':'square', kind==='bad'?.07:.06); at+=d*.9; });
  }catch(e){}
}
let musicTimer=null;
const MEL=[523,0,659,784,659,0,523,587, 659,0,784,880,784,0,659,587, 523,0,659,784,1047,0,880,784, 698,659,587,0,523,0,0,0];
const BASS=[131,131,196,196,175,175,196,196];
function setMusic(on){
  S.music=on; save(); clearInterval(musicTimer); musicTimer=null;
  if(!on) return;
  let st=0;
  musicTimer=setInterval(()=>{
    try{ const t=ac().currentTime; const f=MEL[st%MEL.length]; if(f) tone(f,t,.16,'square',.025); if(st%4===0) tone(BASS[(st/4|0)%BASS.length],t,.32,'triangle',.06); }catch(e){}
    st++;
  }, 170);
}
/* ---------- Voz: elige la voz en español más natural del dispositivo ---------- */
let VOICES = [];
function loadVoices(){ try{ VOICES = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v=>v.lang && /^es/i.test(v.lang)); }catch(e){ VOICES=[]; } }
if(window.speechSynthesis){ loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){} }
function voiceScore(v){
  const n = v.name.toLowerCase(); let sc = 0;
  if(/natural|neural|online/.test(n)) sc += 60;          // Edge: «Microsoft Elvira Online (Natural)»
  if(/premium|enhanced|mejorad|siri/.test(n)) sc += 50;  // iPad/Mac: voces mejoradas
  if(/google/.test(n)) sc += 35;                         // Chrome: «Google español»
  if(/m[oó]nica|paulina|marisol|elvira|alvaro|álvaro|helena|lucia|lucía|dalia|jorge|laura/.test(n)) sc += 15;
  if(/^es[-_]es/i.test(v.lang)) sc += 12; else if(/^es[-_](mx|us|419)/i.test(v.lang)) sc += 6;
  if(/espeak|compact|eloquence|grandma|grandpa|abuel|bad news|bells|bubbles|jester|organ|trinoids|whisper|zarvox|albert|bahh|boing|cellos|deranged|hysterical|junior|ralph|superstar|wobble/.test(n)) sc -= 80;
  if(v.localService === false) sc += 5;
  return sc;
}
function bestVoice(){
  if(!VOICES.length) loadVoices();
  if(S.voice){ const v = VOICES.find(v=>v.name===S.voice); if(v) return v; }
  return VOICES.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0] || null;
}
function speak(text){
  try{
    const s = window.speechSynthesis; if(!s) return;
    s.cancel();
    const clean = text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu,' ').replace(/→/g,', ').replace(/_+|…/g,', ').replace(/\s+/g,' ').trim();
    const v = bestVoice();
    // Frase a frase: las pausas suenan más naturales y evita cortes en textos largos
    const parts = clean.match(/[^.!?¡¿;:]+[.!?;:]*|[¡¿][^!?]+[!?]/g) || [clean];
    parts.map(p=>p.trim()).filter(Boolean).forEach(p=>{
      const u = new SpeechSynthesisUtterance(p);
      u.lang = v ? v.lang : 'es-ES'; if(v) u.voice = v;
      u.rate = S.voiceRate || 0.95; u.pitch = 1.05;
      s.speak(u);
    });
  }catch(e){}
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, 2600); }
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if(reduced()) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--gold','--sense','--lung','--food','--virus','--bone'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:180},()=>({x:c.width/2+(Math.random()-.5)*80, y:c.height*.45, vx:(Math.random()-.5)*16, vy:-6-Math.random()*12, r:Math.random()*6.3, s:7+Math.random()*8, c:rand(cols)}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=.15; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(++f<200) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })();
}
function popText(txt, color){
  if(reduced()) return;
  const d=document.createElement('div'); d.className='pop outline'; d.textContent=txt; if(color) d.style.color=color;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1050);
}
function floatXP(n){
  const r = $('#stage') ? $('#stage').getBoundingClientRect() : {left:innerWidth/2,width:0,top:innerHeight/2};
  const d=document.createElement('div'); d.className='float-xp outline-sm'; d.textContent='+'+n+' XP';
  d.style.left=(r.left+r.width/2-45)+'px'; d.style.top=Math.max(80,r.top)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1200);
}
function setMascot(state){ document.querySelectorAll('.app .mascot, #splash .mascot').forEach(m=>{ m.classList.remove('idle','happy','oops'); void m.getBoundingClientRect(); m.classList.add(state); }); }

/* Fondo animado: células y burbujas flotando */
(function background(){
  const c=$('#bg'), x=c.getContext('2d'); let W,H,items=[];
  const mk = any => { const t=Math.random(); return {x:Math.random()*W, y:any?Math.random()*H:H+40, r:t<.4?8+Math.random()*12:2+Math.random()*4, k:t<.3?'cell':t<.55?'ring':'dot', vy:.15+Math.random()*.4, vx:(Math.random()-.5)*.25, a:Math.random()*6.3}; };
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; items=Array.from({length:Math.min(60,Math.round(W*H/26000)+10)},()=>mk(true)); }
  function draw(){
    x.clearRect(0,0,W,H);
    items.forEach(p=>{
      x.globalAlpha = p.k==='dot' ? .45+.3*Math.sin(p.a*3) : .22;
      if(p.k==='cell'){ x.fillStyle='#FF5A6E'; x.beginPath(); x.ellipse(p.x,p.y,p.r,p.r*.8,p.a,0,7); x.fill(); x.fillStyle='#8E1F31'; x.beginPath(); x.ellipse(p.x,p.y,p.r*.45,p.r*.32,p.a,0,7); x.fill(); }
      else if(p.k==='ring'){ x.strokeStyle='#3FB6FF'; x.lineWidth=2; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.stroke(); }
      else { x.fillStyle='#fff'; x.beginPath(); x.arc(p.x,p.y,p.r*.5,0,7); x.fill(); }
    });
    x.globalAlpha=1;
  }
  function tick(){ items.forEach((p,i)=>{ p.y-=p.vy; p.x+=p.vx; p.a+=.01; if(p.y<-40) items[i]=mk(false); }); draw(); requestAnimationFrame(tick); }
  addEventListener('resize', ()=>{ size(); draw(); });
  size(); if(reduced()) draw(); else tick();
})();

/* ---------- Insignias ---------- */
let pendingBadges = null;
function grant(id){
  const p=P(); if(!p || p.badges.includes(id)) return;
  const b=allBadges().find(b=>b.id===id); if(!b) return;
  p.badges.push(id); save();
  if(pendingBadges) pendingBadges.push(b); else { toast('¡Nueva insignia: '+b.name+'!'); sfx('level'); }
}
function checkBadges(){
  const p=P();
  TEMAS.filter(hasContent).forEach(t=>{
    stagesOf(t).forEach(w=>{ if(stars(p,w.id)>0) grant(w.id); });
    if(t.missions.every(w=>stars(p,w.id)===3)) grant('tres-'+t.id);
  });
}

  const pct = lv.to ? Math.round((p.xp-lv.from)/(lv.to-lv.from)*100) : 100;
  return `<header class="hud panel">

    <div class="xp">
      <div class="xp-top"><span>${p.xp} XP</span><span>${lv.to ? 'Nivel '+(lv.n+1)+' a los '+lv.to : '¡Nivel máximo!'}</span></div>
      <div class="gbar" role="progressbar" aria-label="Experiencia" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(4,pct)}%"></span></div>

/* ---------- Motor de retos ---------- */
let M = null;
function buildBoss(t){
  const quick = c => ['mc','tf','pick','fill'].includes(c.t);
  const list = [];
  t.missions.forEach(w=>list.push(...shuffle(w.ch.filter(quick)).slice(0, t.missions.length>4?1:2)));
  const orders = t.missions.flatMap(w=>w.ch.filter(c=>c.t==='order'));
  if(orders.length) list.push(rand(orders));
  list.push(...(t.boss.extra||[]));
  return shuffle(list).slice(0,12);
}
function startPlay(w){
  M = {w, list: w.boss ? buildBoss(CT) : [...mix(w.ch.filter(c=>c.t!=='esquema')), ...w.ch.filter(c=>c.t==='esquema')], i:0, xp:0, firstOk:0, combo:0, bestCombo:0, mistakes:0, hearts: w.boss?3:null, over:false, res:[]};
  pendingBadges = [];
  const v=$('#view-play'); v.setAttribute('style', cvars(w));
  v.innerHTML = `
    <div class="play-head">
      <button class="iconbtn" id="quit" type="button" aria-label="Salir de la misión">${ico('close')}</button>
      <div><div class="segs" id="segs" aria-hidden="true"></div><div class="play-count" id="pcount"></div></div>
      <div id="play-side"></div>
    </div>
    ${w.boss ? `<div class="arena panel"><div class="fighter">${avatarSVG(P().avatar)}</div><div class="vs"><span class="boss-name outline-sm">${esc(w.villain||'Jefe final')}</span><div class="hp"><span id="hp" style="width:100%"></span></div></div><div class="fighter">${virusSVG()}</div></div>` : ''}
    <div class="qbox"><div>${mascotSVG('idle')}</div><div class="bubble"><h2 id="qtext"></h2><button class="iconbtn" id="read-q" type="button" aria-label="Leer en voz alta">${ico('sound')}</button></div></div>
    <div class="stage panel" id="stage"></div>`;
  v.querySelector('#quit').onclick = ()=>{ pendingBadges=null; goMap(); };
  v.querySelector('#read-q').onclick = ()=>{
    const ch=M.list[M.i]; let t=$('#qtext').textContent;
    if(ch.t==='mc' || ch.t==='pick') t += '. Opciones: ' + ch.opts.join('. ');
    if(ch.t==='esquema') t += '. ' + esqTexto(ch);
    speak(t);
  };
  show('view-play');
  splash(w, ()=>nextCh());
}
function splash(w, done){
  const s=$('#splash'); s.setAttribute('style', cvars(w));
  s.innerHTML = `<div class="splash-in"><div class="mascot-wrap">${w.boss?virusSVG():avatarSVG(P().avatar)}</div><span class="label">Tema ${CT.n} · ${w.boss?'Jefe final':'Misión '+(CT.missions.indexOf(w)+1)}</span><h1 class="outline">${esc(w.title)}</h1><div class="splash-go outline" id="sgo">¡Preparados!</div></div>`;
  s.hidden=false; sfx('tick');
  let finished=false;
  const end = ()=>{ if(finished) return; finished=true; clearTimeout(t1); clearTimeout(t2); s.hidden=true; s.innerHTML=''; done(); };
  const t1=setTimeout(()=>{ const g=$('#sgo'); if(g){ g.textContent='¡YA!'; g.style.animation='none'; void g.offsetWidth; g.style.animation=''; } sfx('go'); }, 1100);
  const t2=setTimeout(end, reduced()?1300:1900);
  s.onclick = end;
}
function drawHead(){
  $('#segs').innerHTML = M.list.map((_,k)=>`<i class="${M.res[k]||(k===M.i?'now':'')}"></i>`).join('');
  $('#pcount').textContent = `Reto ${Math.min(M.i+1,M.list.length)} de ${M.list.length}`;
  $('#play-side').innerHTML = M.hearts!==null
    ? `<div class="hearts" aria-label="${M.hearts} corazones">${[0,1,2].map(k=>ico('heart', k<M.hearts?'full':'empty'+(k===M.hearts&&M.justLost?' lost':''))).join('')}</div>`
    : (M.combo>=2 ? `<span class="combo-badge outline-sm">${ico('flame')}x${M.combo}</span>` : '');
  M.justLost=false;
  if(M.w.boss){ const solved=M.res.filter(Boolean).length; $('#hp').style.width = (100-solved/M.list.length*100)+'%'; }
}
function nextCh(){
  if(M.i>=M.list.length) return finish(true);
  const ch = M.list[M.i];
  M.cur = {mist:0, done:false};
  $('#qtext').textContent = ch.t==='tf' ? '¿Verdadero o falso? '+ch.q : ch.q;
  $('#feedback').hidden = true; $('#fb-next').hidden = true;
  setMascot('idle'); drawHead();
  const box=$('#stage'); box.innerHTML='';
  RENDER[ch.t](ch, box);
}
function feedback(kind, title, msg, next){
  const f=$('#feedback'); f.className='feedback '+(kind==='ok'?'good':'wrong'); f.hidden=false;
  f.style.animation='none'; void f.offsetWidth; f.style.animation='';
  $('#fb-title').textContent=title; $('#fb-msg').textContent=msg||'';
  $('#fb-next').hidden=!next;
  if(next) $('#fb-next').focus({preventScroll:true});
}
function right(){
  if(M.cur.done || M.over) return; M.cur.done=true;
  let gain = 4;
  if(M.cur.mist===0){ M.firstOk++; M.combo++; M.bestCombo=Math.max(M.bestCombo,M.combo); gain = 10 + (M.combo>=3?2:0); M.res[M.i]='ok'; }
  else { M.combo=0; M.res[M.i]='meh'; }
  recordResult(M.cur.mist===0 ? 1 : 0.5);
  M.xp += gain; sfx('ok'); floatXP(gain); setMascot('happy');
  if(M.combo>=3) setTimeout(()=>{ popText('¡COMBO x'+M.combo+'!'); sfx('coin'); }, 150);
  if(M.w.boss){
    const vr=$('#virus'); vr.classList.remove('hit'); void vr.getBoundingClientRect(); vr.classList.add('hit'); sfx('hit');
    if(M.combo<3) popText(rand(['¡ZAS!','¡POW!','¡TOMA!']), 'var(--virus)');
  }
  feedback('ok', rand(PRAISE).toUpperCase(), `+${gain} XP${M.combo>=3?' · ¡racha de '+M.combo+'!':''}`, true);
  if(M.combo>=5) grant('racha');
  drawHead();
}
function wrong(msg){
  if(M.cur.done || M.over) return;
  M.cur.mist++; M.mistakes++; M.combo=0; sfx('bad'); setMascot('oops');
  const st=$('#stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
  if(M.hearts!==null && M.cur.mist===1){
    M.hearts--; M.justLost=true;
    if(M.hearts<=0){
      M.over=true; recordResult(0); drawHead(); st.querySelectorAll('button').forEach(b=>b.disabled=true);
      feedback('bad','¡SIN CORAZONES!','¡No pasa nada! Repasa y vuelve a intentarlo.', false);
      setTimeout(()=>finish(false), 1800); return;
    }
  }
  drawHead();
  feedback('bad', rand(RETRY).toUpperCase(), msg || M.list[M.i].hint || 'Repasa la lección y vuelve a intentarlo.', false);
}
$('#fb-next').onclick = ()=>{ M.i++; nextCh(); };

const RENDER = {
  mc(ch, box){
    const isTF = ch.t==='tf';
    const opts = isTF ? ['Verdadero','Falso'] : ch.opts;
    const ans = isTF ? (ch.a?0:1) : ch.a;
    const key = ch.q;
    const order = isTF ? [0,1] : mix(opts.map((_,i)=>i), r => opts.length>2 && r.indexOf(ans)===lastPos[key], true);
    if(!isTF) lastPos[key] = order.indexOf(ans);
    const look = k => isTF ? (k===0?{c:'c3',s:'<path d="m4 12 5 5L20 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'}:{c:'c0',s:'<path d="M5 5l14 14M19 5 5 19" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'}) : {c:'c'+(k%4), s:SHAPES[k%4]};
    box.innerHTML = `<div class="opts ${opts.some(o=>o.length>34)?'long':''}">${order.map((i,k)=>{ const l=look(k); return `<button class="opt ${l.c}" type="button" data-i="${i}"><svg class="shape" viewBox="0 0 24 24" aria-hidden="true">${l.s}</svg><span>${esc(opts[i])}</span></button>`; }).join('')}</div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===ans){ b.classList.add('win'); box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add('gone'); }); right(); }
      else { b.classList.add('gone'); b.disabled=true; wrong(); }
    });
  },
  tf(ch, box){ RENDER.mc(ch, box); },
  esquema(ch, box){
    const ans = esqRespuestas(ch), filled = ans.map(()=>false);
    const bank = mix([...ans, ...(ch.extra||[])].map((w,j)=>({w,j})));
    const used = new Set(); let active = 0;
    const nextFree = () => filled.findIndex(f=>!f);
    function draw(badGap){
      box.innerHTML = `<div class="sort-wrap"><p class="tip">Toca un hueco y después la palabra que va en él.</p>
        ${esqHTML(ch, i => `<button type="button" class="gap ${filled[i]?'filled':''} ${i===active&&!filled[i]?'active':''} ${i===badGap?'bad':''}" data-g="${i}" ${filled[i]?'disabled':''}>${filled[i]?esc(ans[i]):'?'}</button>`)}
        <div class="chips esq-bank">${bank.map(b=>`<button class="tile chip" type="button" data-b="${b.j}" ${used.has(b.j)||nextFree()<0?'disabled':''}>${esc(b.w)}</button>`).join('')}</div></div>`;
      box.querySelectorAll('.gap').forEach(g=>g.onclick=()=>{ active=+g.dataset.g; sfx('tick'); draw(); });
      box.querySelectorAll('.esq-bank .chip').forEach(c=>c.onclick=()=>{
        const j=+c.dataset.b, w=bank.find(b=>b.j===j).w;
        if(norm(w)===norm(ans[active])){
          filled[active]=true; used.add(j);
          const n=nextFree(); if(n<0){ draw(); right(); return; }
          active=n; sfx('coin'); draw();
        } else {
          const otro = ans.some((a,i)=>!filled[i] && i!==active && norm(a)===norm(w));
          draw(active); wrong(otro ? 'Esa palabra va en otro hueco. Toca primero el hueco correcto.' : null);
        }
      });
    }
    draw();
  },
  pick(ch, box){
    const sel = new Set();
    box.innerHTML = `<div class="sort-wrap"><p class="tip">Puedes tocar varias. Después pulsa <b>Comprobar</b>.</p>
      <div class="chips">${mix(ch.opts.map((_,i)=>i)).map(i=>`<button class="tile chip" type="button" aria-pressed="false" data-i="${i}">${esc(ch.opts[i])}</button>`).join('')}</div>
      <div><button class="btn" type="button" id="check">Comprobar ✔</button></div></div>`;
    box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; b.classList.remove('bad'); sfx('tick');
      sel.has(i) ? sel.delete(i) : sel.add(i); b.setAttribute('aria-pressed', sel.has(i));
    });
    box.querySelector('#check').onclick=()=>{
      if(!sel.size){ toast('Toca al menos una opción'); return; }
      const wrongSel=[...sel].filter(i=>!ch.a.includes(i)), missing=ch.a.filter(i=>!sel.has(i));
      if(!wrongSel.length && !missing.length){
        box.querySelectorAll('.chip').forEach(b=>{ if(sel.has(+b.dataset.i)) b.classList.add('ok'); b.disabled=true; });
        box.querySelector('#check').hidden=true; right();
      } else {
        wrongSel.forEach(i=>box.querySelector(`.chip[data-i="${i}"]`).classList.add('bad'));
        const n=missing.length;
        wrong(!wrongSel.length ? `Vas bien, pero te ${n===1?'falta una':'faltan '+n}.` : (ch.hint||null));
      }
    };
  },
  order(ch, box){
    const n=ch.items.length; let placed=Array(n).fill(null); const locked=Array(n).fill(false);
    let pool=mix(ch.items.map((_,i)=>i));
    let busy=false;
    function draw(badIdx=[]){
      box.innerHTML = `<div class="sort-wrap"><p class="tip">Toca las tarjetas en orden. Si te equivocas al colocar una, tócala para quitarla.</p>
        <ol class="slots-list">${placed.map((v,k)=>`<li><button class="tile slot ${v!==null?'filled':''} ${locked[k]?'ok':''} ${badIdx.includes(k)?'bad':''}" type="button" data-k="${k}" ${v===null||locked[k]?'disabled':''}><span class="num">${k+1}</span><span>${v===null?'…':esc(ch.items[v])}</span></button></li>`).join('')}</ol>
        <div class="pool">${pool.filter(i=>!placed.includes(i)).map(i=>`<button class="tile card-opt" type="button" data-i="${i}">${esc(ch.items[i])}</button>`).join('')}</div></div>`;
      box.querySelectorAll('.card-opt').forEach(b=>b.onclick=()=>{
        if(busy) return;
        const k=placed.indexOf(null); placed[k]=+b.dataset.i; sfx('tick');
        if(!placed.includes(null)) check(); else draw();
      });
      box.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ if(busy) return; placed[+b.dataset.k]=null; draw(); });
    }
    function check(){
      const bad=[]; placed.forEach((v,k)=>{ if(v===k) locked[k]=true; else bad.push(k); });
      if(!bad.length){ draw(); box.querySelectorAll('button').forEach(b=>b.disabled=true); right(); return; }
      draw(bad); busy=true;
      wrong(`Hay ${bad.length} tarjeta${bad.length>1?'s':''} fuera de su sitio. Las verdes ya están bien.`);
      setTimeout(()=>{ busy=false; if(M.over) return; placed=placed.map((v,k)=>locked[k]?v:null); draw(); }, 1300);
    }
    draw();
  },
  classify(ch, box){
    const items=mix(ch.items); let k=0; const got=ch.bins.map(()=>[]);
    function draw(){
      const it=items[k];
      box.innerHTML = `<div class="sort-wrap">
        <div class="sort-item" aria-live="polite">${it?esc(it[0]):'¡Todo clasificado!'}</div>
        <p class="tip" style="text-align:center">${it?`Tarjeta ${k+1} de ${items.length}: ¿dónde va?`:''}</p>
        <div class="bins b${ch.bins.length}">${ch.bins.map((b,i)=>`<button class="tile bin" type="button" data-b="${i}" ${it?'':'disabled'}><span class="bin-name outline-sm">${esc(b)}</span><span class="bin-list">${got[i].map(esc).join('<br>')}</span></button>`).join('')}</div></div>`;
      box.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{
        if(+b.dataset.b===it[1]){
          got[it[1]].push(it[0]); k++;
          if(k===items.length){ draw(); right(); } else { sfx('coin'); draw(); }
        } else {
          b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
          const s=box.querySelector('.sort-item'); s.classList.remove('bad'); void s.offsetWidth; s.classList.add('bad');
          wrong();
        }
      });
    }
    draw();
  },
  match(ch, box){
    const n=ch.pairs.length; let selL=null, done=0;
    const L=mix(ch.pairs.map((_,i)=>i)), R=mix(ch.pairs.map((_,i)=>i), r=>r.some((v,k)=>v===L[k]));
    box.innerHTML = `<div class="sort-wrap"><p class="tip">Toca una tarjeta de la izquierda y después su pareja de la derecha.</p>
      <div class="match"><div class="col">${L.map(i=>`<button class="tile m l" type="button" data-i="${i}">${esc(ch.pairs[i][0])}</button>`).join('')}</div>
      <div class="col">${R.map(i=>`<button class="tile m r" type="button" data-i="${i}">${esc(ch.pairs[i][1])}</button>`).join('')}</div></div></div>`;
    box.querySelectorAll('.m.l').forEach(b=>b.onclick=()=>{
      box.querySelectorAll('.m.l').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=+b.dataset.i; sfx('tick');
    });
    box.querySelectorAll('.m.r').forEach(b=>b.onclick=()=>{
      if(selL===null){ toast('Primero toca una tarjeta de la izquierda'); return; }
      const l=box.querySelector(`.m.l[data-i="${selL}"]`);
      if(+b.dataset.i===selL){
        [l,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('ok'); x.disabled=true; });
        selL=null; done++;
        if(done===n) right(); else sfx('coin');
      } else {
        b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'), 500); wrong();
      }
    });
  },
  fill(ch, box){
    let k=0; const bank=mix([...ch.answers, ...ch.bank]); const used=new Set();
    function draw(){
      const sent = ch.parts.map(p=> typeof p==='number'
        ? `<span class="blank ${p<k?'filled':''} ${p===k?'active':''}">${p<k?esc(ch.answers[p]):'____'}</span>` : esc(p)).join('');
      box.innerHTML = `<div class="sort-wrap"><p class="sentence">${sent}</p><p class="tip">Toca la palabra que va en el hueco que parpadea.</p>
        <div class="chips">${bank.map((w,j)=>`<button class="tile chip" type="button" data-j="${j}" ${used.has(j)||k>=ch.answers.length?'disabled':''}>${esc(w)}</button>`).join('')}</div></div>`;
      box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
        const j=+b.dataset.j;
        if(bank[j]===ch.answers[k]){
          used.add(j); k++;
          if(k===ch.answers.length){ draw(); right(); } else { sfx('coin'); draw(); }
        } else { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); wrong(); }
      });
    }
    draw();
  }
};

/* ---------- Resultado ---------- */
function finish(success){
  const p=P(), w=M.w, n=M.list.length, ratio=M.firstOk/n;
  const st = success ? (ratio>=.85?3 : ratio>=.6?2 : 1) : 0;
  const before = levelOf(p.xp);
  const tIdx = TEMAS.indexOf(CT), nextT = TEMAS[tIdx+1];
  const wasBeaten = temaBeaten(p, CT), nextWasOpen = nextT ? temaOpen(tIdx+1) : true;
  p.xp += M.xp;
  const rec = p.worlds[w.id] || {stars:0, plays:0, best:0};
  rec.plays++; rec.stars=Math.max(rec.stars, st); rec.best=Math.max(rec.best||0, Math.round(ratio*100));
  p.worlds[w.id]=rec;
  if(success && M.mistakes===0) grant('perfecto');
  checkBadges(); save();
  const after = levelOf(p.xp), news = pendingBadges || []; pendingBadges = null;
  let unlockMsg = '';
  if(w.boss && success && !wasBeaten && nextT){
    unlockMsg = hasContent(nextT) && !nextWasOpen ? `¡Nuevo tema desbloqueado! Tema ${nextT.n}: ${nextT.title}` : !hasContent(nextT) ? `¡Tema ${CT.n} superado! El tema ${nextT.n} llegará pronto.` : '';
  }
  $('#feedback').hidden = true;
  const go = () => {
    const v=$('#view-result'); v.setAttribute('style', cvars(w));
    const banner = !success ? '¡Casi lo consigues!' : w.boss ? '¡Jefe derrotado!' : '¡Misión superada!';
    const say = !success ? 'Has sumado los puntos que conseguiste. Repasa y vuelve a intentarlo: ¡seguro que lo logras!' : st<3 ? '¡Muy bien! Repite la misión para conseguir las 3 estrellas.' : '¡Perfecto! ¡Eres un auténtico explorador!';
    const ut = nextT ? cvars(nextT) : '';
    v.innerHTML = `<div class="result">
      <div class="ribbon ${success?'':'fail'}">${banner}</div>
      <div class="star-stage"><div class="big-stars" id="bigstars" aria-label="${st} de 3 estrellas">${[0,1,2].map(()=>ico('star')).join('')}</div></div>
      <div class="guide" style="text-align:left;margin:0;width:100%"><div>${mascotSVG(success?'happy':'oops')}</div><div class="bubble">${say}</div></div>
      <div class="res-stats">
        <div class="panel"><b class="outline-sm">${M.firstOk}/${n}</b><small>a la primera</small></div>
        <div class="panel"><b class="outline-sm" id="xpcount">+0</b><small>puntos XP</small></div>
        <div class="panel"><b class="outline-sm">${M.bestCombo}</b><small>mejor racha</small></div>
      </div>
      ${unlockMsg ? `<div class="unlock-banner" style="${ut}">${esc(unlockMsg)}</div>` : ''}
      ${after.n>before.n ? `<div class="levelup outline-sm">¡SUBES AL NIVEL ${after.n}! · ${after.name}</div>` : ''}
      ${news.length ? `<div class="chest panel"><h3 class="outline-sm">${ico('chest')} ¡Cofre de insignias!</h3>${news.map((b,k)=>`<div class="new-badge" style="animation-delay:${1+k*.3}s"><span class="medal" style="${badgeStyle(b)}">${ico(b.icon)}</span><span><b style="font-family:var(--f-game);font-weight:400;font-size:1.2rem">${esc(b.name)}</b><br><small style="color:var(--ink-soft)">${esc(b.desc)}</small></span></div>`).join('')}</div>` : ''}
      <div class="row" style="justify-content:center">
        ${w.boss && success ? `<button class="btn gold" type="button" id="r-course">${ico('map')} Mapa del curso</button><button class="btn dark" type="button" id="r-map">Mapa del tema</button>`
          : `<button class="btn gold" type="button" id="r-map">Volver al mapa ▶</button>`}
        <button class="btn dark" type="button" id="r-again">Repetir</button>
      </div></div>`;
    v.querySelector('#r-map').onclick=goMap;
    const rc=v.querySelector('#r-course'); if(rc) rc.onclick=goCourse;
    v.querySelector('#r-again').onclick=()=>startPlay(w);
    show('view-result');
    const icons=v.querySelectorAll('#bigstars .icon');
    for(let k=0;k<st;k++) setTimeout(()=>{ icons[k].classList.add('on'); sfx('star'); }, 350+k*380);
    const xc=v.querySelector('#xpcount'), total=M.xp, t0=performance.now();
    (function count(t){ const f=Math.min(1,(t-t0)/900); xc.textContent='+'+Math.round(total*f); if(f<1) requestAnimationFrame(count); })(t0);
    if(st>=2) setTimeout(confetti, 350+st*380);
    setTimeout(()=>sfx(success?'win':'bad'), 250);
    if(after.n>before.n || unlockMsg) setTimeout(()=>sfx('level'), 1500);
    speak(banner + (unlockMsg ? '. '+unlockMsg : ''));
  };
  if(w.boss && success){ $('#virus').classList.add('dead'); sfx('hit'); popText('¡K.O.!', 'var(--virus)'); setTimeout(go, 1100); }
  else go();
}

/* ---------- Zona de calma ---------- */
let calmTimer = null;
function renderCalm(){
  clearTimeout(calmTimer);
  const v=$('#view-calm'); v.setAttribute('style','--c:var(--lung);--cd:var(--lung-d)');
  v.innerHTML = `<div class="topbar"><button class="iconbtn" id="cback" type="button" aria-label="Volver">${ico('back')}</button><h1 class="outline">Zona de calma</h1></div>
    <div class="calm">
      <div class="guide" style="text-align:left;margin:0"><div>${mascotSVG('idle')}</div><div class="bubble">Respirar profundamente nos ayuda a calmarnos. Cuando el círculo crece, toma aire. Cuando se hace pequeño, suéltalo despacio.</div></div>
      <div class="breath-stage"><div class="breath-ring"></div><div class="breath" id="breath"></div><div class="breath-label outline-sm" id="blabel">¿Preparado?</div></div>
      <div class="phase-steps"><span data-p="0">1 · Inspiración</span><span data-p="1">2 · Mantén</span><span data-p="2">3 · Espiración</span></div>
      <p class="tip" id="bcount">Haremos 3 respiraciones.</p>
      <button class="btn" type="button" id="bstart">Empezar ▶</button>
      <div id="feel" hidden style="display:grid;gap:12px"></div>
    </div>`;
  const back = ()=>{ clearTimeout(calmTimer); CT ? goMap() : goCourse(); };
  v.querySelector('#cback').onclick=back;
  v.querySelector('#bstart').onclick=()=>runBreath(back);
  show('view-calm');
}
function runBreath(back){
  const b=$('#breath'), label=$('#blabel'), btn=$('#bstart'); btn.hidden=true;
  const phases=[['Toma aire por la nariz',4000,1.9],['Mantén el aire',3000,1.9],['Suelta el aire por la boca',5000,1]];
  const names=['Inspira','Mantén','Espira'];
  let cycle=0, ph=0;
  function step(){
    if(cycle>=3) return done();
    const [say,ms,scale]=phases[ph];
    b.style.transitionDuration=ms+'ms'; b.style.transform=`scale(${scale})`;
    label.textContent=names[ph];
    document.querySelectorAll('.phase-steps span').forEach(s=>s.classList.toggle('on', +s.dataset.p===ph));
    $('#bcount').textContent=`Respiración ${cycle+1} de 3`;
    speak(cycle===0 ? say : names[ph]);
    calmTimer=setTimeout(()=>{ ph++; if(ph===3){ ph=0; cycle++; } step(); }, ms);
  }
  function done(){
    label.textContent='¡Muy bien!'; setMascot('happy');
    document.querySelectorAll('.phase-steps span').forEach(s=>s.classList.remove('on'));
    $('#bcount').textContent='Has terminado el ejercicio.';
    const f=$('#feel'); f.hidden=false;
    f.innerHTML=`<b style="font-family:var(--f-game);font-size:1.5rem;font-weight:400">¿Cómo te sientes ahora?</b>
      <div class="feel">${[['😟','Todavía nervioso'],['😐','Igual'],['🙂','Más tranquilo'],['😄','¡Muy tranquilo!']].map(([e,l])=>`<button class="tile" type="button" aria-label="${l}" title="${l}">${e}</button>`).join('')}</div>`;
    f.querySelectorAll('button').forEach((x,i)=>x.onclick=()=>{
      const p=P(); let msg = i<2 ? 'Puedes repetir el ejercicio varias veces hasta sentirte mejor.' : '¡Genial! Recuerda este ejercicio cuando estés nervioso.';
      if(p && !p.calmDone){ p.calmDone=true; p.xp+=15; msg+=' +15 XP'; save(); }
      if(p) grant('calma');
      speak(msg);
      f.innerHTML=`<p style="font-weight:700">${esc(msg)}</p><div class="row" style="justify-content:center"><button class="btn" type="button" id="bagain">Repetir</button><button class="btn dark" type="button" id="bmap">Volver al mapa</button></div>`;
      f.querySelector('#bagain').onclick=renderCalm; f.querySelector('#bmap').onclick=back;
    });
    sfx('win');
  }
  step();
}
